version: "3.8"

services:
  # Fast, asynchronous transaction scoring API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-risk-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # Interactive risk operations & executive analytics dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-risk-dashboard
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
    depends_on:
      - api
